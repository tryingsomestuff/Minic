name: Build + Coverage + Documentation

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install documentation tools
      run: python -m pip install Markdown

    - name: Install GCC and coverage tools
      run: |
        sudo apt update
        sudo apt install gcc g++ lcov

    - name: Build with Make
      run: make

    - name: Run coverage script
      run: Tools/build/docov

    - name: Upload coverage result as artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-dir/rapport

    - name: Build GitHub Pages site
      run: |
        mkdir -p _site/coverage _site/technical
        cp Doc/index.html _site/index.html
        cp -a coverage-dir/rapport/. _site/coverage/
        python Doc/technical/build_html.py --output _site/technical/index.html

    - name: Deploy site to GitHub Pages
      if: github.ref == 'refs/heads/master'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: _site
